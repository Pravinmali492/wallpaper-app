<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wallpaper Haven</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>HD Wallpaper Hub</h1>
    <p>Search and download high-resolution wallpapers for mobile & desktop</p>
    
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search wallpapers (e.g. Nature, Cyberpunk)..." value="nature">
      <button id="searchBtn">Search</button>
    </div>
  </header>

  <main class="gallery" id="gallery"></main>

  <script src="script.js"></script>
</body>
</html>
